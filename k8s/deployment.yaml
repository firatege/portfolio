apiVersion: apps/v1
kind: Deployment
metadata:
  name: byfeb-portfolio
  namespace: feb
  labels:
    app: byfeb-portfolio
spec:
  replicas: 2
  selector:
    matchLabels:
      app: byfeb-portfolio
  template:
    metadata:
      labels:
        app: byfeb-portfolio
    spec:
      imagePullSecrets:
      - name: regcred
      containers:
      - name: portfolio
        image: hub.umceko.com/byfeb/portfolio:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
        livenessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: byfeb-portfolio-svc
  namespace: feb
spec:
  selector:
    app: byfeb-portfolio
  ports:
  - port: 80
    targetPort: 8080
  type: ClusterIP
